name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      # Install root dependencies
      - name: Install root dependencies
        run: npm install
        
      # Install backend dependencies
      - name: Install backend dependencies
        run: |
          cd backend
          npm install
          
      # Install sim-web dependencies (INI YANG FIX ERROR VITE!)
      - name: Install sim-web dependencies
        run: |
          cd sim-web
          npm install
          
      # Build frontend
      - name: Build frontend
        run: |
          cd sim-web
          npm run build
          
      # Deploy to Hostinger via FTP
      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/sim-web/src/**
            **/sim-web/public/**
            **/sim-web/vite.config.js
            **/sim-web/package-lock.json
            **/backend/package-lock.json
            **/package-lock.json
            **/*.md
            **/.env
            **/tests/**
            **/.github/**
            
      - name: Deployment Status
        if: success()
        run: echo "✅ Deployment berhasil ke Hostinger!"